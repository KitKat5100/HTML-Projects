<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>CallMom2</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let momText = $('#momText');
            let stage = $('#stage');
            
            //Preparing scene
            stage.css("background-image", "url('Images/Piano/Call2.jpg')");
            $("#playerTextbox").hide(); 
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.05;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();

            //Setting textbox color for the scene
            changeTextbox(playerTextbox, 2, 2);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if (progress == 1) {
                    changeText(momText, "Are you really betting everything on this competition?");
                } else if (progress == 2) {
                    changeText(momText, "Do you really think you can become a concert pianist after this?");
                } else if (progress == 3) {
                    changeText(momText, "That you can guarantee enough gigs to pay rent?");
                } else if (progress == 4) {
                    playerText.text("Please mom just, stop. I... I can't deal with this today."); 
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 5) {
                    momText.text("I’ve been patient enough but it’s time you accept that it’s not working out."); 
                    $('#playerTextbox').fadeOut(160); 
                    $('#momTextbox').fadeIn(160);
                } else if (progress == 6) {
                    changeTextbox(playerTextbox, 2, 2);
                    setName(" ");
                    playerText.text("Each sentence drives a knife through my heart. I get it. I get where she’s coming from but-"); 
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 7) {
                    momText.text("Just please, listen to me and-"); 
                    $('#playerTextbox').fadeOut(160); 
                    $('#momTextbox').fadeIn(160);
                } else if (progress == 8) {
                    changeBackground("url('Images/Black.png')");
                    playerText.text("Click. I hung up on her."); 
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 9) {
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 1);
                        playerText.text("I know it's not working out, mom");
                        setName("Alfira");
                    }); 
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 10) {
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 2);
                        playerText.text("I say to myself. My voice is shakey, the words stuck in my throat; like I dont' want to admit it");
                        setName("");
                    }); 
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 11) {
                    changeText(playerText, "I take a few deep breaths, trying to calm down");
                    fadeOutSound($('#BGM'), 3000);
                } else if (progress == 12) {
                    changeBackground("url('Images/Piano/Day.jpg')");
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 2);
                        playerText.text("...and resume my practice.");
                        setName("");
                    }); 
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 13) {
                    window.location = "scene8.html";
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Confession.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">It's morning...</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = momTextbox class="textbox">
			<p id ="momText" class="text">Is that attitude I hear? I see you're not taking my advice to heart Alfira.</p>
            <p id ="momName" class="name">Mom</p>
		</div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
