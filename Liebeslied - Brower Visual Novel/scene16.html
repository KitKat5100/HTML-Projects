<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>AfterPractice2</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            $('#BGM')[0].volume = 0.5;
            $('#BGM')[0].currentTime = 57; 
            $('#BGM')[0].play();
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let stage = $('#stage');

            //Local Storage Variables
            let  pianoScore = parseInt(localStorage.getItem("pianoScore"));
            let anetteScore = parseInt(localStorage.getItem("anetteScore"));
            console.log(pianoScore);
            console.log(anetteScore);
            
            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            stage.css("background-image", "url('Images/Piano/Day.jpg')");
            changeTextbox(playerTextbox, 1, 2);
            changeTextbox($('#choice1'), 1, 1);
            changeTextbox($('#choice2'), 1, 1);

            //Setting textbox color for the scene

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(playerText, "Music once again fills up my senses.");
                }
                else if(progress == 2){
                    changeBackground("url('Images/Piano/Night.jpg')");
                    changeText(playerText, "I sit here for the next few hours, practicing until my eyes threaten to close shut.");
                } else if (progress == 3){
                    changeText(playerText, "Looking at the time it's...");
                } else if (progress == 4){
                    changeText(playerText, "Ah, I forgot to eat dinner again.");
                    fadeOutSound($('#BGM'), 8000);
                } else if (progress == 5){
                    changeText(playerText, "After eating some leftovers, I open my phone to check some emails.");
                } else if (progress == 6){
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 1);
                        playerText.text("'Piano workshop with Patrick Reyes: Opportunities for growth.'");
                        setName("Email Advertisment");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 7){
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 2);
                        playerText.text("Patrick Reyes, one of the more prominent pianists in the classical sphere, and one of my inspirations.");
                        setName("");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 8){
                    changeText(playerText, "This would be a great opportunity to receive feedback on my playing");
                } else if (progress == 9){
                    changeText(playerText, "…not to mention the networking benefits I could gain from this.");
                } else if (progress == 10){
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 1);
                        playerText.text("What date is it on?");
                        setName("Alfira");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 11){
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 2);
                        playerText.text(" That’s the same day as my date with Anette. ");
                        setName("");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 12){
                    changeText(playerText, "I know I said I’d meet up with her but… this is such a rare opportunity. So close to the competition too");
                } else if (progress == 13){
                    $('#choice1').show();
                    $('#choice2').show();
                } else if (progress == 14 && (choice1 || choice2)){
                    if(choice1) {
                        pianoScore += 600;
                        $('#choice1').fadeOut(160); 
                        $('#choice2').fadeOut(160); 
                        changeText(playerText, "I click on the attached link to sign up for the workshop.");
                    } else if (choice2){
                        anetteScore += 300; 
                        $('#choice1').fadeOut(160); 
                        $('#choice2').fadeOut(160); 
                        changeText(playerText, "As amazing as this would be, Anette is more important. And I’ve really been ignoring her recently.");
                    }
                } else if (progress == 15){
                    if(choice1) {
                        changeText(playerText, "There’s a slight pang of guilt in my chest as I do so. But I really, need this.");
                    } else if (choice2){
                        changeText(playerText, "I close the page and resume my day.");
                    }
                } else if (progress == 16){
                    if(choice1) {
                        choice1 = false;
                        window.location = "scene17.html";
                    } else if (choice2){
                        choice2 = false; 
                        window.location = "scene18.html";
                    }
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0.0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Liebeslied.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">My hand glides across the keys.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text">Sign up for the workshop.</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text">Push through with the date.</p>
        </div>


        <div id="stage2">
        </div>

	</div>

</body>
</html>
