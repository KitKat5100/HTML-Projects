<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>AnetteEnding</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');
            
            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            $('#anetteTextbox2').hide();
            stage.css("background-image", "url('Images/Door2/N_Neutral.jpg')");
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.1;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();


            //Setting textbox color for the scene
            setName("Alfira");
            changeTextbox(playerTextbox, 1, 1);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(playerText, "And I’m so, so sorry for everything that I must’ve put you through.");
                } else if (progress == 2){
                    anetteText.text("Do you really mean that, Elfie?");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 3){
                    playerText.text("Yes, I do- I really do. Please believe me.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 4){
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("");
                        changeTextbox(playerTextbox, 1, 2); 
                        playerText.text("A silence washes over us as she stares into my eyes. As if she's trying to assess my sincerity.");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 5){
                    fadeOutSound($('#BGM'), 8000);
                    changeText(playerText, "After a long silence, she pulls me into a hug.");
                } else if (progress == 6){
                    changeText(playerText, "Her next words come out shaky, like she's trying to hold back tears");
                } else if (progress == 7){
                    changeBackground("url('Images/Door2/N_Smiling.jpg')");
                    anetteText.text("I love you, Elfie.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 8){
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("Alfira");
                        changeTextbox(playerTextbox, 1, 1); 
                        playerText.text("I love you too, Anette.");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 9){
                    changeBackground("url('Images/Black.png')");
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("");
                        changeTextbox(playerTextbox, 1, 2); 
                        playerText.text("As the days went by, I made greater efforts to spend time with Anette.");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 10){
                    changeText(playerText, "I still attended the competition, but with the idea that it would be my last.");
                } else if (progress == 11){
                    changeText(playerText, "As expected, I didn't place. And shortly after, I took up a job as a music teacher at a school.");
                } else if (progress == 12){
                    changeText(playerText, "But...it didn't bother me as much as it would've before. Because now, I have something else that drives me.");
                } else if (progress == 13){
                    changeText(playerText, "Someone, even, and I look forward to her being in my life for the years to come.");
                } else if (progress == 14){
                    window.location = "index.html"; 
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Nothingness.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">You are, Anette. You're more important to me.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = "anetteTextbox2" class="textbox">
			<p id ="anetteText" class="text">Anette... I...</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
