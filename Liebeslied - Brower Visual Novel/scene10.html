<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>DoorTalk2</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');
            
            //Local Storage Variables
            let  pianoScore = parseInt(localStorage.getItem("pianoScore"));
            let anetteScore = parseInt(localStorage.getItem("anetteScore"));
            console.log(pianoScore);
            console.log(anetteScore);

            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            $('#anetteTextbox').hide(); 
            stage.css("background-image", "url('Images/Piano/Day.jpg')");
            $('#BGM')[0].play();
            fadeInSound($('#BGM'), 8000);

            //Setting textbox color for the scene
            changeTextbox(playerTextbox, 3, 1); 
            setName("Anette");

            stage.click(updateText);
            function updateText(){
                progress++; 
                if (progress == 1){
                    $('#playerTextbox').fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 2);
                        $('#playerText').text("I open the door.");  
                        setName("");
                    });   
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 2){
                    changeBackground("url('Images/Door1/D_Neutral.jpg')");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 3){
                    playerText.text("I’m sorry, I’ve been practising piano the whole day and didn’t notice."); 
                    changeTextbox(playerTextbox, 2, 1);
                    setName("Alfira");
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 4){
                    anetteText.text("I figured. And since you can’t find it in yourself to take a break, it’s up to me to make you."); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 5){
                    playerText.text("Anette, you don't have to-"); 
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 6){
                    anetteText.text("Nope, no buts. I'm not hearing it."); 
                    changeBackground("url('Images/Door1/D_Closed.jpg')");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 7){
                    changeBackground("url('Images/Door1/D_Neutral.jpg')");
                    changeTextbox(playerTextbox, 2, 2);
                    setName("");
                    playerText.text("She looks up at me with pleading eyes.");
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 8){
                    anetteText.text("Please?"); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 9){
                    $('#anetteTextbox').fadeOut(160);
                    $('#choice1').fadeIn(160); 
                    $('#choice2').fadeIn(160); 
                } else if(progress == 10 && (choice2 || choice1)){
                    $('#choice1').fadeOut(160); 
                    $('#choice2').fadeOut(160); 
                    setName("Alfira");
                    changeTextbox(playerTextbox, 2, 1); 
                    if(choice1) {
                        playerText.text("Alright, you've convinced me."); 
                    } else if (choice2){
                        playerText.text("Sorry love, not today.");  
                    }
                    $('#playerTextbox').fadeIn(160); 
                }  else if (progress == 11){
                    bgmTime = $("#BGM")[0].currentTime;
                    localStorage.setItem('bgmTime', bgmTime); 
                    if(choice1) {
                        anetteScore += 100;
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore); 
                        window.location = "scene12.html";
                    } else if (choice2){
                        pianoScore += 300; 
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore); 
                        window.location = "scene11.html";
                    }
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            });

            $('#choice2').click(function(){
                choice2 = true; 
            });

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.05}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Have A Short Rest.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">Elfie? You there?</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = anetteTextbox class="textbox">
			<p id ="anetteText" class="text">You've been ignoring my messages again.</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text">Alright</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text">Sorry, not today</p>
        </div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
