<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>Practice2</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let animTime = 0;
            let score = 0

                        /*
            Bar Positions: 
            Spaces
            1st: 6vh
            2nd: 13 vh
            3rd: 20vh
            4th: 27 vh 

            Lines
            1st: 9.5vh
            2nd: 16.5vh
            3rd: 23.5vh

            Keycodes
            W: 87
            S: 83
            A: 65
            D: 68
            */

            var isPlaying = false; 
           //The main array that's going to be used
            var noteArray;
            var notePosition;
            var noteVerticalPosition;
            var noteTime;
            var noteKey;

            //Local Storage Variables
            let  pianoScore = parseInt(localStorage.getItem("pianoScore"));
            let anetteScore = parseInt(localStorage.getItem("anetteScore"));
            console.log(pianoScore);
            console.log(anetteScore);

            //First sequence of notes
            var noteArrayOne = new Array($('#note_1'), $('#note_2'), $('#note_3'), $('#note_4'), $('#note_5'), $('#note_6'), $('#note_7'), $('#note_8'), $('#note_9'));
            var notePositionOne = new Array(0.26, 0.33, 0.38, 0.42, 0.44, 0.49, 0.52, 0.55, 0.58); 
            var noteVerticalPositionOne = new Array(13, 13, 13, 9.5, 16.5, 20, 13, 16.5, 20); 
            var noteTimeOne = new Array(15, 29, 40, 48, 54, 66, 72, 79, 86); //%completion of the bar scrolling animation
            var noteKeyOne = new Array(87, 87, 87, 68, 65, 87, 68, 87, 65);

            //Second sequence of notes
            var noteArrayTwo = new Array($('#note_11'), $('#note_12'), $('#note_13'), $('#note_14'), $('#note_15'), $('#note_16'), $('#note_17'));
            var notePositionTwo = new Array(0.29, 0.37, 0.41, 0.43, 0.475, 0.495, 0.54); 
            var noteVerticalPositionTwo = new Array(16.5, 16.5, 16.5, 13, 13, 16.5, 16.5); 
            var noteTimeTwo = new Array(19, 37, 47, 50, 60, 64, 75); //%completion of the bar scrolling animation
            var noteKeyTwo = new Array(87, 87, 87, 68, 68, 87, 87);

            //Third sequence of notes
            var noteArrayThree = new Array($('#note_21'), $('#note_22'), $('#note_23'), $('#note_24'), $('#note_25'), $('#note_26'));
            var notePositionThree = new Array(0.26, 0.32, 0.36, 0.40, 0.42, 0.5); 
            var noteVerticalPositionThree = new Array(16.5, 16.5, 13, 9.5, 16.5, 13); 
            var noteTimeThree = new Array(13, 26, 36, 45, 48, 65); //%completion of the bar scrolling animation
            var noteKeyThree = new Array(65, 65, 87, 68, 65, 68);

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let stage = $('#stage');
            $('#scoreTextbox').hide(); 
            
            //Preparing scene
            stage.css("background-image", "url('Images/Black.png')");
            changeTextbox(playerTextbox, 1, 2);
            $('#notes').hide(); 
            $('#notesTwo').hide(); 
            $('#notesThree').hide(); 
            $('#bar').hide(); 
            noteArray = noteArrayOne;
            notePosition = notePositionOne;
            noteVerticalPosition = noteVerticalPositionOne; 
            noteTime = noteTimeOne;
            noteKey = noteKeyOne; 
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.05;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();
            fadeOutSound($('#BGM'), 4000);

            //Setting note positions, coded to be scaleable
            for(i = 0; i < noteArrayOne.length; i++){
                noteArrayOne[i].css("left", (notePositionOne[i])* jQuery(window).width() + "px");
                noteArrayOne[i].css("top", noteVerticalPositionOne[i] + "vh");
            }

            for(i = 0; i < noteArrayTwo.length; i++){
                noteArrayTwo[i].css("left", (notePositionTwo[i] - 0.01)* jQuery(window).width() + "px");
                noteArrayTwo[i].css("top", noteVerticalPositionTwo[i] + "vh");
            }

            for(i = 0; i < noteArrayThree.length; i++){
                noteArrayThree[i].css("left", (notePositionThree[i] - 0.01)* jQuery(window).width() + "px");
                noteArrayThree[i].css("top", noteVerticalPositionThree[i] + "vh");
            }

            stage.click(updateText);
            function updateText(){
                if(animTime == 100) {
                    isPlaying = false;
                }


                progress++; 
                if(progress == 1){
                    changeText(playerText, "The week continues as usual.");
                } else if (progress == 2){
                    changeBackground("url('Images/Piano/Day.jpg')");
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 2);
                        playerText.text("I sit in front of the piano once again.");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 3){
                    changeBackground("url('Images/Piano/Day_Staff_Blank.jpg')");
                    $('#bar').show(); 
                    $('#scoreTextbox').show(); 
                    $('#notes').show();
                    changeText(playerText, "Okay, let's practice.");
                } else if (progress == 4){
                    $('#playerTextbox').fadeOut(160);
                    animateBar(5500, '#Sequence21');
                } else if (progress == 5 && isPlaying == false){
                    playerText.text("and then...");
                    $('#notes').hide(); 
                    $('#playerTextbox').fadeIn(160); 
                    noteArray = noteArrayTwo;
                    notePosition = notePositionTwo;
                    noteVerticalPosition = noteVerticalPositionTwo; 
                    noteTime = noteTimeTwo;
                    noteKey = noteKeyTwo; 
                } else if (progress == 6){
                    $('#notesTwo').show(); 
                    $('#playerTextbox').fadeOut(160);
                    animateBar(5500, '#Sequence22');
                } else if (progress == 7 && isPlaying == false){
                    playerText.text("Last one for the page.");
                    $('#notesTwo').hide();  
                    $('#playerTextbox').fadeIn(160); 
                    noteArray = noteArrayThree;
                    notePosition = notePositionThree;
                    noteVerticalPosition = noteVerticalPositionThree; 
                    noteTime = noteTimeThree;
                    noteKey = noteKeyThree;
                } else if (progress == 8){
                    $('#playerTextbox').fadeOut(160);
                    $('#notesThree').show();
                    animateBar(5500, '#Sequence23');
                } else if (progress == 9 && isPlaying == false){
                    pianoScore += score; 
                    localStorage.setItem('pianoScore', pianoScore); 
                    localStorage.setItem('anetteScore', anetteScore);
                    window.location = "scene16.html";
                } else { 
                    progress--; 
                }
            }

            //Player Input Functions, most of it is for debugging. 
                $(document).keydown(function(event) {
                if(event.keyCode == 87){
                    //  console.log("Time: " + animTime);
                    //  console.log("Position: " + $('#bar').position().left / jQuery(window).width());
                } else if(event.keyCode == 68){
                    //  console.log("Time: " + animTime);
                    //  console.log("Position: " + $('#bar').position().left / jQuery(window).width());
                } else if(event.keyCode == 65){
                    //  console.log("Time: " + animTime);
                    //  console.log("Position: " + $('#bar').position().left / jQuery(window).width());
                } else if(event.keyCode == 32){
                    // animateBar(5500, '#Sequence23'); 
                } 
                checkTiming(event.keyCode); 
            })

            //Checks if player input is in time
            function checkTiming(keyCode) {
                let allowance = 3; 
                let hit = false;

                for(i = 0; i < noteTime.length; i++){
                    if(animTime > (noteTime[i] - allowance) && animTime < (noteTime[i] + allowance)){ //If they got the right timing
                        if(keyCode == noteKey[i]){ //If they got the right key
                            hit = true;
                            noteArray[i].attr('src','Images/Notes/Green_Note.png');
                            i = noteTime.length + 1; 
                        }
                    } 
                }

                if(hit){
                        score += 50;
                } else {
                    if(score > 0){ //Score wont go down to a negative number
                        score -= 20;
                    }
                }

                $("#score").text("Score: " + score);
            }

            //Animates the bar
            function animateBar(duration, audio){
                if(isPlaying == false){
                    isPlaying = true; 
                    $(audio)[0].play();
                    $(audio)[0].volume = 0.6;
                    $('#bar').css("left", "20vw");
                    $('#bar').animate({
                        left: '65vw'
                    }, {
 		                progress: function(animation, progress, msRemaining) {
	                        animTime = 100 * progress;
	                    },
	                    easing: 'linear',
	                    duration: duration
  	                });
                }
            }


            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Have A Short Rest.mp3" id="BGM" loop></audio>
    <audio src="Audio/Sequence_2_1.mp3" id="Sequence21"></audio>
    <audio src="Audio/Sequence_2_2.mp3" id="Sequence22"></audio>
    <audio src="Audio/Sequence_2_3.mp3" id="Sequence23"></audio>

	<div id="stage">
        <!-- Bar for the minigame -->
        <img src="Images/Black.png" id="bar">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">Anette soon takes her leave.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id="scoreTextbox">
            <p id="score">Score: </p>
        </div>

        <div id="stage2">
        </div>

        <!-- Notes -->
        <div id="notes">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_1">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_2">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_3">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_4">
            <img src="Images/Notes/Left_Note.png" class = "note" id="note_5">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_6">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_7">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_8">
            <img src="Images/Notes/Left_Note.png" class = "note" id="note_9">
        </div>

        <div id="notesTwo">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_11">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_12">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_13">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_14">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_15">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_16">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_17">
        </div>

        
        <div id="notesThree">
            <img src="Images/Notes/Left_Note.png" class = "note" id="note_21">
            <img src="Images/Notes/Left_Note.png" class = "note" id="note_22">
            <img src="Images/Notes/Up_Note.png" class = "note" id="note_23">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_24">
            <img src="Images/Notes/Left_Note.png" class = "note" id="note_25">
            <img src="Images/Notes/Right_Note.png" class = "note" id="note_26">
        </div>

	</div>

</body>
</html>
