<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>Fight</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 
            let choice3 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');

            //Local Variables
            let pianoScore = localStorage.getItem("pianoScore");
            let anetteScore = localStorage.getItem("anetteScore");
            console.log(pianoScore);
            console.log(anetteScore);
            
            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            $('#choice3').hide();
            $('#choice1Unselectable').hide();
            $('#choice2Unselectable').hide();
            $('#anetteTextbox2').hide();
            stage.css("background-image", "url('Images/Door2/N_Neutral.jpg')");
            $('#BGM')[0].play();
            fadeInSound($('#BGM'), 8000);

            //Setting textbox color for the scene
            setName("Alfira");
            changeTextbox(playerTextbox, 1, 1);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeBackground("url('Images/Door2/N_Sad.jpg')");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 2){
                    playerText.text("I'm sorry, I promise next time I'll");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 3){
                    changeBackground("url('Images/Door2/N_Neutral.jpg')");
                    anetteText.text("Elfie, I need you to talk to me.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 4){
                    playerText.text("Does it have to be now dear? I'm in the middle of practice.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 5){
                    anetteText.text("Yes, Elfie, that's exactly why.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 6){
                    changeText(anetteText, "I texted you all day, called you thrice, and you didn't pick up! It's concerning how-");
                } else if (progress == 7){
                    playerText.text("Anette can we please not talk about this tonight");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 8){
                    changeBackground("url('Images/Door2/N_Sad.jpg')");
                    anetteText.text("Then when, Alfira?");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 9){
                    changeText(anetteText, "You're busy today, and tomorrow, and every other day after that.");
                } else if (progress == 10){
                    changeText(anetteText, "I've been so patient but I can hardly get through to you anymore, it's like I don't exist to you.");
                } else if (progress == 11){
                    playerText.text("You know it's not like that.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 12){
                    changeBackground("url('Images/Door2/N_Neutral.jpg')");
                    anetteText.text("Then why does it feel that way?");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 13){
                    playerText.text("An akward silence fills the air. And I feel a heavy sense of guilt");
                    changeTextbox(playerTextbox, 1, 2);
                    setName("");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 14){
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("Alfira");
                        changeTextbox(playerTextbox, 1, 1); 
                        playerText.text("You're...you're right, Anette. I haven't been the best partner recently.");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 15){
                    changeText(playerText, "I promise that after the competition, I'm gonna-");
                } else if (progress == 16){
                    anetteText.text("Everything is after the competition. And then what?");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 17){
                    changeText(anetteText, "If you lose will you stop there? Will you stop trying?");
                } else if (progress == 18){
                    changeText(anetteText, "And if you win, will you finally have time for me? Is it not just gonna be more of this?");
                } else if (progress == 19){
                    playerText.text("Tears start to build up in her eyes");
                    changeTextbox(playerTextbox, 1, 2);
                    setName("");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 20){
                    anetteText.text("I want to support your dream, Elfie, I really do.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 21){
                    changeText(anetteText, "But I also want someone who makes me feel cared for, who wants what I want too. ");
                } else if (progress == 22){
                    playerText.text("She takes a deep breath, and lifts her head to look at me.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 23){
                    anetteText.text("Alfira, am I more important to you?");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 24){
                    playerText.text("I...");
                    changeTextbox(playerTextbox, 1, 1);
                    setName("Alfira");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 25){
                    $('#playerTextbox').fadeOut(160);
                    if(pianoScore >= 2500){ //You succeeded in piano
                        $('#choice1').fadeIn(160); 
                    } else {
                        $('#choice1Unselectable').fadeIn(160); 
                    }

                    if(anetteScore >= 500){ //You succeeded with Anette
                        $('#choice2').fadeIn(160); 
                    } else {
                        $('#choice2Unselectable').fadeIn(160); 
                    }

                    if(pianoScore < 2500 && anetteScore < 500){
                        $('#choice3').fadeIn(160); 
                    }
                } else if (progress == 26 && (choice1 || choice2 || choice3)){
                    bgmTime = $("#BGM")[0].currentTime;
                    localStorage.setItem('bgmTime', bgmTime); 
                    if(choice1){
                        window.location = "scene23.html";
                    } else if (choice2) {
                        window.location = "scene24.html";
                    } else if (choice3) {
                        window.location = "scene25.html"; 
                    }
                }else { 
                    progress--; 
                }
            }

            //Setting what endings you can get
            if(pianoScore < 2500) { //not enough piano
                $("#choice1").attr("class","unselectable");
            }
            if(anetteScore < 500) { //not enough anette

            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })
            $('#choice3').click(function(){
                choice3 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.1}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Nothingness.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">Anette...I didn't know you were stopping by.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = "anetteTextbox2" class="textbox">
			<p id ="anetteText" class="text">I sent you a text saying that I would. Guess you didn't read it, as usual.</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text">I can't give up on my dream.</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text">I love you.</p>
        </div>

        <div class="textbox" id="choice3">
            <p class="text">...</p>
        </div>

        <div class="textbox" id="choice1Unselectable">
            <p class = "text">I can't give up on my dream.</p>
        </div>

        <div class="textbox" id="choice2Unselectable">
            <p class="text">I love you.</p>
        </div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
