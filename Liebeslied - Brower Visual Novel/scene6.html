<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>CallMom</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let momText = $('#momText');
            let stage = $('#stage');
            
            //Preparing scene
            stage.css("background-image", "url('Images/Room/Day.jpg')");
            $("#momTextbox").hide(); 
            $('#BGM')[0].play();
            fadeInSound($('#BGM'), 8000);

            //Setting textbox color for the scene
            changeTextbox(playerTextbox, 2, 2);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(playerText, "The day went by as usual, with me playing at local bars and restaurants in the area.");
                } else if (progress == 2){
                    changeText(playerText, "I sit on my piano stool, ready to practice when-");
                    changeBackground("url('Images/Piano/Day.jpg')");
                } else if (progress == 3){
                    $('#Phone')[0].volume = 0.05;
                    $('#Phone')[0].play();
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 1);
                        playerText.text("Ugh...");
                        setName("Alfira");
                    });   
                } else if (progress == 4){
                    changeBackground("url('Images/Piano/Call1.jpg')");
                    playerTextbox.fadeIn(160); 
                } else if (progress == 5){
                    $('#Phone')[0].pause();
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 2);
                        playerText.text("I reluctantly answer the call.");
                        setName("");
                    }); 
                    playerTextbox.fadeIn(160); 
                } else if (progress == 6){
                    changeBackground("url('Images/Piano/Call2.jpg')");
                    playerTextbox.fadeOut(160);
                    $('#momTextbox').fadeIn(160);
                } else if (progress == 7){
                    changeTextbox(playerTextbox, 2, 1);
                    playerText.text("Oh, I'm good."); 
                    setName("Alfira");
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 8){
                    momText.text("Did you see the link I sent you the other day? Did you have a look at it?"); 
                    $('#playerTextbox').fadeOut(160); 
                    $('#momTextbox').fadeIn(160);
                } else if (progress == 9){
                    playerText.text("Yeah, of course I did."); 
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 10) {
                    changeText(playerText, "A bold faced lie.");
                    changeText($('#playerName'), ""); 
                } else if (progress == 11) {
                    momText.text("Your auntie showed it to me after I talked about how much you've been struggling recently."); 
                    $('#playerTextbox').fadeOut(160); 
                    $('#momTextbox').fadeIn(160);
                } else if (progress == 12) {
                    changeText(momText, "Or, you know, you could set up a studio! People pay well for private tutors.");
                } else if (progress == 13) {
                    changeText(momText, "If you get a stable job you might also be able to move into a better apartment-");
                } else if (progress == 14) {
                    changeTextbox(playerTextbox, 2, 2); 
                    playerText.text("She goes on and on, talking about everything I could be except what I am."); 
                    $('#momTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                }  else if (progress == 15) {
                    changeText(playerText, "Over time her voice starts to muffle as the irritation creeps into my skull.");
                }  else if (progress == 16) {
                    playerTextbox.fadeOut(160, function() {
                        changeTextbox(playerTextbox, 2, 1);
                        playerText.text("Yes mom. I know. I get it");
                        setName("Alfira");
                    }); 
                    playerTextbox.fadeIn(160);
                } else if (progress == 17) {
                    bgmTime = $("#BGM")[0].currentTime;
                    localStorage.setItem('bgmTime', bgmTime); 
                    window.location = "scene7.html";
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.05}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Confession.mp3" id="BGM" loop></audio>
    <audio src="Audio/Phone.mp3" id="Phone"></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">It's morning...</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = momTextbox class="textbox">
			<p id ="momText" class="text">Hi sweetie! How are you? </p>
            <p id ="momName" class="name">Mom</p>
		</div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
