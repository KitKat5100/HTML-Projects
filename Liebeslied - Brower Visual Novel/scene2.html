<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>Introduction2</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let stage = $('#stage');
            let playerTextbox = $('#playerTextbox');

            //Setting up BGM continuation
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.3;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();

            //Preparing scene
            stage.css("background-image", "url('Images/Piano/Night.jpg')");

            //Setting textbox colors for the scene
            changeTextbox(playerTextbox, 1, 2); 

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(playerText, "It's not enough. Not if I want to win.");
                } else if (progress == 2){
                    fadeOutSound($('#BGM'), 300);
                    changeText(playerText, "A knock on my door disrupts my practice"); 
                    $('#Knock')[0].volume = 0.2;
                    $('#Knock')[0].play();
                } else if (progress == 3){
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("Anette");
                        changeTextbox(playerTextbox, 3, 1); 
                        playerText.text("Hey Elfie! It's just me.");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 4){
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("");
                        changeTextbox(playerTextbox, 1, 2); 
                        playerText.text("My shoulders relax as I get up to open the door. ");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 5){
                    window.location = "scene3.html";
                    
                }
            }

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Liebeslied.mp3" id="BGM" loop></audio>
    <audio src="Audio/Knock.mp3" id="Knock" ></audio>

	<div id="stage">

		<div id = "playerTextbox" class="textbox">
			<p id ="playerText" class="text"> It's night outside. I must've been sat here for about 5 hours, playing away until my fingers go numb. But, </p>
            <p id ="playerName" class="name"></p>
		</div>
	</div>

</body>
</html>
