<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>TalkAccepted</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 
            let choice3 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');

            //Local Storage Variables
            let  pianoScore = parseInt(localStorage.getItem("pianoScore"));
            let anetteScore = parseInt(localStorage.getItem("anetteScore"));
            console.log(pianoScore);
            console.log(anetteScore);

            //Preparing scene
            stage.css("background-image", "url('Images/Door1/D_Smile.jpg')");
            $("#anetteTextbox3").hide();
            $('#playerTextbox2').hide();
            $("#choice1").hide();
            $("#choice2").hide();
            $("#choice3").hide();
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.05;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();


            //Setting textbox color for the scene

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeBackground("url('Images/Together.jpg')");
                    changeText(playerText, "We both lie down on my bed.");
                } else if (progress == 2){
                    $('#playerTextbox').fadeOut(160);
                    $("#anetteTextbox3").fadeIn(160); 
                } else if (progress == 3){
                    changeText(anetteText, "Where do you want to start?")
                } else if (progress == 4){
                    $("#anetteTextbox3").fadeOut(160); //Memes, vs. TV Shows, vs. Pets
                    $("#choice1").fadeIn(160); 
                    $("#choice2").fadeIn(160); 
                    $("#choice3").fadeIn(160); 
                    progress = 20;
                } else if (progress == 5){//'Your life' vs. 'The Competition'
                    $('#playerTextbox2').fadeOut(160);
                    $("#choice1").fadeIn(160); 
                    $("#choice2").fadeIn(160); 
                } else if (progress == 6 && (choice1 || choice2)){ 
                    $("#choice1").fadeOut(160); 
                    $("#choice2").fadeOut(160); 
                    if(choice1){
                        $('#playerText2').text("What else have you been up to these days? I feel like we haven’t caught up in awhile.");
                        $('#playerTextbox2').fadeIn(160);
                    } else if (choice2) { //go to alfira tree
                        bgmTime = $("#BGM")[0].currentTime;
                        localStorage.setItem('bgmTime', bgmTime); 
                        window.location = "scene14.html";
                    }
                } else if (progress == 7){
                    $('#anetteText').text("Where do I even begin? There’s…. A lot. Mainly at my job.");
                    $('#playerTextbox2').fadeOut(160);
                    $("#anetteTextbox3").fadeIn(160);
                } else if (progress == 8) {
                    $('#playerText2').text("That much huh? Sorry that I haven’t stayed updated.");
                    $('#playerTextbox2').fadeIn(160);
                    $("#anetteTextbox3").fadeOut(160); 
                } else if (progress == 9) {
                    $('#anetteText').text("It’s alright. I get that you’re busy.");
                    $('#playerTextbox2').fadeOut(160);
                    $("#anetteTextbox3").fadeIn(160);
                    choice1 = false;
                    $('#choice1Text').text("The competition");
                    $('#choice2Text').text("Your week");
                    $('#choice3Text').text("No time");
                }else if (progress == 10) { //The Competition vs No Time vs Your Week
                    $("#choice1").fadeIn(160); 
                    $("#choice2").fadeIn(160); 
                    $("#choice3").fadeIn(160);
                    $("#anetteTextbox3").fadeOut(160);
                    progress = 25; 
                }else if (progress == 11) {//I know how you feel vs It'll work out
                    $("#anetteTextbox3").fadeOut(160); 
                    $("#choice1").fadeIn(160); 
                    $("#choice2").fadeIn(160); 
                } else if (progress == 12 && (choice1 || choice2)) {
                    $("#choice1").fadeOut(160); 
                    $("#choice2").fadeOut(160); 
                    if(choice1){// I know how you feel
                        $('#playerText2').text("I know how you feel. I can never guarantee that gigs will keep coming my way too.");
                        $('#playerTextbox2').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160); 
                    } else if (choice2) {//It'll work out
                        $('#playerText2').text("You’re good at your job Anette, and a hard worker to boot. They won't pass out on the chance to hire someone as amazing as you.");
                        $('#playerTextbox2').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160); 
                    }
                } else if (progress == 13) {
                    if(choice1){
                        changeText($('#playerText2'), "It's rough. All we can do is our best.");
                    } else if (choice2) {
                        changeText($('#playerText2'), "Trust me, love, it’ll work out.");   
                    }
                } else if (progress == 14) {
                    if(choice1){
                        $('#anetteText').text("Yeah...");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160);
                    } else if (choice2) {
                        $('#anetteText').text("Thank you, Elfie");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160);
                    }
                }  else if (progress == 15) {
                    if(choice1){
                        changeText($('#anetteText'), "I know you’ve been struggling quite a bit too. How are you?");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160);
                    } else if (choice2) {
                        playerText.text("She smiles at me. I can see some of the tension leave her shoulders");
                        $('#playerTextbox').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160);
                    }
                }  else if (progress == 16) {
                    if(choice1){
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore);
                        bgmTime = $("#BGM")[0].currentTime;
                        localStorage.setItem('bgmTime', bgmTime); 
                        window.location = "scene14.html";
                    } else if (choice2){
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore);
                        bgmTime = $("#BGM")[0].currentTime;
                        localStorage.setItem('bgmTime', bgmTime); 
                        window.location = "scene13.html";
                    }
                } else if (progress == 21 && (choice1 || choice2 || choice3)){//Memes, pets, & tv shows tree
                    $("#choice1").fadeOut(160); 
                    $("#choice2").fadeOut(160); 
                    $("#choice3").fadeOut(160);
                    if(choice1){    
                        $('#playerText2').text("How's that new show you're watching? It's one of those sappy kdramas right?"); 
                    } else if (choice2) {
                        $('#playerText2').text("You’ve been blowing up my phone with Instagram reels recently.");
                    } else if (choice3){
                        $('#playerText2').text("How’s mochi been doing?");
                    }
                    $('#playerTextbox2').fadeIn(160);
                } else if (progress == 22){
                    $('#playerTextbox2').fadeOut(160);
                    if(choice1){    
                        $('#anetteText').text("Not just any sappy Kdrama."); 
                    } else if (choice2) {
                        $('#anetteText').text("A girl gets bored at work.");
                    } else if (choice3){
                        $('#anetteText').text("The same little gremlin as always.");
                    }
                    $("#anetteTextbox3").fadeIn(160); 
                } else if (progress == 23){
                    if(choice1){    
                        changeText(anetteText, "A totally cringe, enemies to lover kdrama where the main lead is a CEO.");
                    } else if (choice2) {
                        $('#playerText2').text("I thought you were a hard worker?");
                        $('#playerTextbox2').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160); 
                    } else if (choice3){
                        changeText(anetteText, "You know last night, she pawed at my face until I woke up,");
                    }
                } else if (progress == 24){
                    if(choice1){    
                        changeText(anetteText, "Just my type of cheese.");
                    } else if (choice2) {
                        $('#anetteText').text("Not when the ‘work’ includes stuffy 2 hour business meetings that don’t actually concern me.");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160); 
                    } else if (choice3){
                        changeText(anetteText, "just because she wanted to sleep on my pillow instead. The audacity.");
                    }
                } else if (progress == 25){
                    if(choice1){    
                        $('#playerText2').text("Typical you.");
                        choice1 = false;
                    } else if (choice2) {
                        $('#playerText2').text("You know what, fair.");
                        $('#playerTextbox2').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160);
                        choice2 = false; 
                    } else if (choice3){
                        $('#playerText2').text("Typical cat behaviour.");
                        choice3 = false; 
                    }
                    $('#playerTextbox2').fadeIn(160);
                    $("#anetteTextbox3").fadeOut(160); 
                    progress = 4;
                    $('#choice1Text').text("Your life");
                    $('#choice2Text').text("The competition");
                } else if (progress == 26 && (choice1 || choice2 || choice3)){ //'The competition', 'no time', 'your week' tree
                    $("#choice1").fadeOut(160); 
                    $("#choice2").fadeOut(160); 
                    $("#choice3").fadeOut(160);
                    if(choice1){ //The Competition
                        bgmTime = $("#BGM")[0].currentTime;
                        localStorage.setItem('bgmTime', bgmTime); 
                        window.location = "scene14.html";
                    } else if (choice2){ // Your week
                        $('#playerText2').text("Well, I can start making up for that now. So, what’s been happening?");
                        $('#playerTextbox2').fadeIn(160);
                        choice2 = false;
                        choice1 = true;
                        progress = 29; 
                    } else if (choice3){ //no time
                        $('#playerText2').text("I just feel like I haven’t been making enough time for you. I’m… I’m sorry about that.");
                        $('#playerTextbox2').fadeIn(160);
                    }
                } else if (progress == 27){
                    if(choice3) {
                        $('#anetteText').text("Yeah. It’s been getting harder to get a hold of you. Call me back more often, Alright?");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160); 
                        $('#choice1Text').text("Your week");
                        $('#choice2Text').text("Feeling tired");
                        choice3 == false;
                    }
                } else if (progress == 28){ //Your Week vs Feeling Tired
                    $("#choice1").fadeIn(160); 
                    $("#choice2").fadeIn(160); 
                    $("#anetteTextbox3").fadeOut(160); 
                } else if (progress == 29 && (choice1 || choice2)){
                    $("#choice1").fadeOut(160); 
                    $("#choice2").fadeOut(160); 
                    if(choice1){//Your Week
                        $('#playerText2').text("Well, I can start making up for that now. So, what’s been happening?");
                        $('#playerTextbox2').fadeIn(160);
                    } else if (choice2){ //feeling tired
                        $('#playerText2').text("I will.");
                        $('#playerTextbox2').fadeIn(160);
                    }
                } else if (progress == 30){
                    if(choice1){//Your Week
                        anetteScore += 100; 
                        $('#anetteText').text("Remember my paid internship thingy? The two-year program.");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160); 
                    } else if (choice2){ 
                        changeText($('#playerText2'), "Sorry, I’m always so preoccupied with practice that it leaves me exhausted most days.");
                        $('#playerTextbox2').fadeIn(160);
                    }
                } else if (progress == 31){
                    if(choice1){//Your Week
                        $('#playerText2').text("Yeah.");
                        $('#playerTextbox2').fadeIn(160);
                        $("#anetteTextbox3").fadeOut(160); 
                    } else if (choice2){ 
                        $('#anetteText').text("I’ve noticed. It really does sound like a lot. How have you been holding up?");
                        $('#playerTextbox2').fadeOut(160);
                        $("#anetteTextbox3").fadeIn(160); 
                    }
                } else if (progress == 32){
                    if(choice1){//Your Week
                        $('#playerText').text("Anette takes a deep breath before continuing.");
                        $('#playerTextbox2').fadeOut(160);
                        $('#playerTextbox').fadeIn(160);
                    } else if (choice2){ 
                        bgmTime = $("#BGM")[0].currentTime;
                        localStorage.setItem('bgmTime', bgmTime); 
                        window.location = "scene14.html";
                    }
                } else if (progress == 33){
                    $('#anetteText').text("It ends in six weeks. And if I did well enough, they’ll offer me a full time position at the company.");
                    $("#anetteTextbox3").fadeIn(160); 
                    $('#playerTextbox').fadeOut(160);
                } else if (progress == 34){
                    $('#playerText2').text("That sounds exciting, love!");
                    $('#playerTextbox2').fadeIn(160);
                    $("#anetteTextbox3").fadeOut(160);
                } else if (progress == 35){
                    $('#anetteText').text("Yeah but… I'm still not sure. Competition’s tough, y’know? Who knows if I’ll actually land the job.");
                    $("#anetteTextbox3").fadeIn(160); 
                    $('#playerTextbox2').fadeOut(160);
                    choice1 = false; 
                    $('#choice1Text').text("I know how you feel");
                    $('#choice2Text').text("It'll work out");
                    progress = 10; 
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })
            $('#choice3').click(function(){
                choice3 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.1}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Have A Short Rest.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">Anette flahses me a wide grin.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = playerTextbox2 class="textbox">
			<p id ="playerText2" class="text"></p>
            <p id ="playerName2" class="name">Alfira</p>
		</div>

        <div id = anetteTextbox3 class="textbox">
			<p id ="anetteText" class="text">It's been awhile since we've caught up.</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text" id="choice1Text">TV Shows</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text" id="choice2Text">Memes</p>
        </div>

        <div class="textbox" id="choice3">
            <p class="text" id="choice3Text">Pets</p>
        </div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
