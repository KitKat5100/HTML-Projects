<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>PianoEnding</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');
            
            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            $('#anetteTextbox2').hide();
            stage.css("background-image", "url('Images/Door2/N_Neutral.jpg')");
            let bgmTime = localStorage.getItem("bgmTime");
            $('#BGM')[0].volume = 0.1;
            $('#BGM')[0].currentTime = bgmTime; 
            $('#BGM')[0].play();


            //Setting textbox color for the scene
            setName("Alfira");
            changeTextbox(playerTextbox, 1, 1);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 2){
                    playerText.text("I'm sorry. I can't say that, I can't give up my dream.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 3){
                    changeBackground("url('Images/Door2/N_Sad.jpg')");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeOut(160, function() {
                        setName("");
                        changeTextbox(playerTextbox, 1, 2); 
                        playerText.text("My voice shakes with the realisation of what my words meant");
                    });  
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 4){
                    changeText(playerText, "She stares at me for awhile. Pain, sadness, and resignation in her eyes.");
                } else if (progress == 5){
                    changeText(playerText, "After awhile, she speaks up.");
                } else if (progress == 6){
                    changeBackground("url('Images/Door2/N_Neutral.jpg')");
                    anetteText.text("Well, thank you for finally being honest with me.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 7){
                    changeText(anetteText, "I wish you the best of luck with your competition.");
                } else if (progress == 8){
                    playerText.text("I try to mutter out another apology before she cuts me off.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 9){
                    anetteText.text("I'm sorry for wasting your time. Goodnight, Alfira.");
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox2').fadeIn(160);
                } else if (progress == 10){
                    fadeOutSound($('#BGM'), 8000);
                    changeBackground("url('Images/Black.png')");
                    playerText.text("She promply shuts the door and leaves. For the last time.");
                    $('#anetteTextbox2').fadeOut(160);
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 11){
                    changeText(playerText, "The day of the competition arrived." );
                } else if (progress == 12){
                    changeText(playerText, "In my hour of need, the hard work I put in did not abandon me." );
                } else if (progress == 13){
                    changeText(playerText, "The hundreds of hours, all the late nights, all the sacrifice, this is what it was for." );
                } else if (progress == 14){
                    changeText(playerText, "I placed first." );
                } else if (progress == 15){
                    changeText(playerText, "People finally started to take notice of me - to listen." );
                } else if (progress == 16){
                    changeText(playerText, "And I’d spend the next many years practising and performing, in front of a bigger crowd, in front of that bigger stage." );
                } else if (progress == 17){
                    changeText(playerText, "Although a certain someone wasn't in that audience, it didn't bother me. I felt fulfilled." );
                } else if (progress == 18){
                    changeText(playerText, "My dream became a reality." );
                } else if (progress == 19){
                    window.location = "index.html"; 
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Nothingness.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">Anette... I...</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = "anetteTextbox2" class="textbox">
			<p id ="anetteText" class="text">Well?</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text">Yeet</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text">I love you.</p>
        </div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
