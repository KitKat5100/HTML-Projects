<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>DoorTalk1</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let anetteText = $('#anetteText');
            let stage = $('#stage');
            
            //Preparing scene
            $('#choice1').hide();
            $('#choice2').hide();
            $('#playerTextbox').hide();
            stage.css("background-image", "url('Images/Door1/N_Smile.jpg')");
            $('#BGM')[0].play();
            fadeInSound($('#BGM'), 8000);

            //Setting textbox color for the scene
            changeTextbox(playerTextbox, 1, 2); 
            changeTextbox($('#choice1'), 1, 1);
            changeTextbox($('#choice2'), 1, 1);

            //Local Storage Variables
            let  pianoScore = parseInt(localStorage.getItem("pianoScore"));
            let anetteScore = parseInt(localStorage.getItem("anetteScore"));
            console.log(pianoScore);
            console.log(anetteScore);

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(anetteText, "Anyways, it was nearby and I thought I’d stop by to say hi on my way home.");
                } else if (progress == 2){
                    changeBackground("url('Images/Door1/N_Closed.jpg')");
                    playerText.text("She pauses a bit before continuing, as if waiting for something."); 
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 3){
                    anetteText.text("How's practice going love?"); 
                    changeBackground("url('Images/Door1/N_Smile.jpg')");
                    $('#playerTextbox').fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 1); 
                        setName("Alfira");
                    });   
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 4){
                    playerText.text("It’s going alright. The pieces are muscle memory to me by now, just working on expression and clarity as usual."); 
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 5){

                    changeBackground("url('Images/Door1/N_Suprised.jpg')");
                    anetteText.text("You already sound so good though! It’s surprising to think you could get any better."); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 6){
                    playerText.text("I need to be better for the competition though."); 
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 7){
                    changeBackground("url('Images/Door1/N_Neutral.jpg')");
                    $('#playerTextbox').fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 2); 
                        setName("");
                        playerText.text("Anette takes a deep sigh, glancing at some of the mess beyond my door."); 
                    });   
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 8){
                    anetteText.text("You have been taking care of yourself, right? Drinking enough water?"); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 9){
                    playerText.text("She says, cupping my face with her hands."); 
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if(progress == 10){
                    $('#playerTextbox').fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 1); 
                        setName("Alfira");
                        playerText.text("I'm fine Anette, but thanks for worrying."); 
                    });   
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 11){
                    changeText(playerText, "She squints her eyes and pouts. I’m certain she can see the fatigue on my face."); 
                    changeText($('#playerName'), ""); 
                } else if (progress == 12){
                    changeText(playerText, "This is the final stretch, alright?");  
                    changeText($('#playerName'), "Alfira"); 
                }else if (progress == 13){
                    changeText(playerText, "I pry her hands off to hold them properly."); 
                    changeText($('#playerName'), ""); 
                } else if (progress == 14){
                    changeText(playerText, "By this time next month I’ll be holding a 1st place trophy in one hand, and I’ll use the cash prize in the other to treat you out to a nice dinner. Okay?"); 
                    changeText($('#playerName'), "Alfira"); 
                } else if (progress == 15){
                    changeBackground("url('Images/Door1/N_Closed.jpg')");
                    anetteText.text("Okayy."); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 16){
                    changeBackground("url('Images/Door1/N_Neutral.jpg')");
                    changeText(anetteText, "But go to bed soon, alright? It’s late and I really should get going.");
                } else if (progress == 17){
                    playerText.text("'I wish I could,' I prevent myself from saying."); 
                    changeTextbox(playerTextbox, 1, 2);
                    setName("");
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 18){
                    changeBackground("url('Images/Door1/N_Smile.jpg')");
                    anetteText.text("It was really nice seeing you for a bit today. Night Elfie, I love you."); 
                    $('#playerTextbox').fadeOut(160);
                    $('#anetteTextbox').fadeIn(160);
                } else if (progress == 19){
                    playerText.text("I love you too, Anette"); 
                    changeTextbox(playerTextbox, 1, 1);
                    setName("Alfira");
                    $('#anetteTextbox').fadeOut(160);
                    $('#playerTextbox').fadeIn(160); 
                } else if (progress == 20){
                    fadeOutSound($("#BGM"), 4000);
                    changeBackground("url('Images/Room/Night.jpg')");
                    $('#playerTextbox').fadeOut(160, function() {
                        changeTextbox(playerTextbox, 1, 2); 
                        setName("");
                        playerText.text("The door closes once more. Looking around my room, I really should…."); 
                    });   
                    $('#playerTextbox').fadeIn(160);
                } else if (progress == 21){
                    $('#choice1').fadeIn(160); 
                    $('#choice2').fadeIn(160); 
                } else if(choice1 || choice2){
                    $('#choice1').fadeOut(160); 
                    $('#choice2').fadeOut(160); 
                    if(choice1) {
                        anetteScore += 100
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore);
                        choice1 = false;
                        window.location = "scene5.html";
                    } else if (choice2){
                        pianoScore += 300; 
                        localStorage.setItem('pianoScore', pianoScore); 
                        localStorage.setItem('anetteScore', anetteScore);
                        choice2 = false; 
                        window.location = "scene4.html";
                    }
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(36,23,22, 0.95)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(36,23,22, 1)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.05}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Have A Short Rest.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text"> It's night outside. I must've been sat here for about 5 hours, playing away until my fingers go numb. But, </p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id = anetteTextbox class="textbox">
			<p id ="anetteText" class="text"> I was out drinking with some of my coworkers. Alexi and Cali, remember them?</p>
            <p id ="anetteName" class="name">Anette</p>
		</div>

        <div class="textbox" id="choice1">
            <p class = "text">Sleep</p>
        </div>

        <div class="textbox" id="choice2">
            <p class="text">Practice piano</p>
        </div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
