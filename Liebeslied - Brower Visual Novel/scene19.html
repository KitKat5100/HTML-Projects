<!DOCTYPE html>
<html> 

<head>
	<meta charset="UTF-8">
	<title>Buildup</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		$(document).ready(function(){
            //Setup
            $('#BGM')[0].play();
            $('#BGM')[0].currentTime = 134; 
            fadeInSound($('#BGM'), 4000);
            let progress = 0;
            let choice1 = false; 
            let choice2 = false; 

            //Shortcuts to make typing easier
            let playerText = $('#playerText');
            let playerTextbox = $('#playerTextbox');
            let stage = $('#stage');
            
            //Preparing scene
            stage.css("background-image", "url('Images/Room/Night.jpg')");
            changeTextbox(playerTextbox, 1,2);

            //Setting textbox color for the scene

            stage.click(updateText);
            function updateText(){
                progress++; 
                if(progress == 1){
                    changeText(playerText, "I still texted and called Anette often, but I'd be lying if I said there wasn't anything else on my mind.");
                } else if (progress == 2){
                    changeText(playerText, "In fact, it's all I could think about.");
                } else if (progress == 3){
                    changeText(playerText, "The competition... what it could mean for me, what it could do for my life.");
                } else if (progress == 4){
                    changeText(playerText, "I'm sick and tired of feeling like some second-rate musician.");
                } else if (progress == 5){
                    changeText(playerText, "I've dedicated most of my life to piano, my childhoon even, to the dream of being a concert pianist.");
                } else if (progress == 6){
                    changeText(playerText, "I'll have nothing to me if I give this up.");
                }  else if (progress == 7){
                    changeText(playerText, "Well, almost nothing.");
                } else if (progress == 8){
                    changeText(playerText, "A strange mix of anxiety, desperation, and hope propell me to practice.");
                    fadeOutSound($('#BGM'), 4000);
                } else if (progress == 9){
                    changeBackground("url('Images/Piano/Night.jpg')");
                    changeText(playerText, "I sit at the piano from dawn till dusk, hoping to perfect my skills.");
                } else if (progress == 10){
                    changeBackground("url('Images/Piano/Night.jpg')");
                    window.location = "scene20.html";
                } else { 
                    progress--; 
                }
            }

            //Choice functions
            $('#choice1').click(function(){
                choice1 = true; 
            })
            $('#choice2').click(function(){
                choice2 = true; 
            })

            //Changes textbox name + applies fade in/out
            function setName(name){
                $('#playerName').text(name); 
            }

            //Smooth background transition by preemptively loading it on a separate scene to remove black flash
            function changeBackground(url){
                $('#stage2').css("background-image", url).delay(100).show(function(){
                    stage.css("background-image", "none");
                    stage.css("background-image", url);
                    
                });
                //stage.css("background-image", "none");
            }

            //Changes text + applies fade in/out
            function changeText(person, text){
                person.fadeOut(160, function(){
                    person.text(text);
                });
                person.fadeIn(160);
            }

            //Changes textbox color and type
            function changeTextbox(textbox, color, boxType){ 
                if(color == 1){ //White
                    textbox.css("background-color", "rgba(222,218,220,0.9)");
                    textbox.css("color", "rgba(127,103,103, 1)");
                    textbox.css("border", "5px solid rgba(127,103,103, 1)");
                } else if(color == 2){ //Dark Brown
                    textbox.css("background-color", "rgba(56, 35, 33, 0.97)");
                    textbox.css("color", "rgba(245, 235, 223, 1)");
                    textbox.css("border", "5px solid rgba(70, 51, 49, 0.97)");
                } else if(color == 3){ //Anette Burgundy
                    textbox.css("background-color", "rgba(114,42,44, 0.97)");
                    textbox.css("color", "rgba(248,233,233, 1)");
                    textbox.css("border", "5px solid rgba(110,57,59, 1)");
                }

                if(boxType == 1){ //Dialogue Box
                    textbox.css("border-radius", "30px");
                } else if (boxType == 2){ //Thought Box
                    textbox.css("border-radius", "100px");
                }
            }

            function fadeInSound(audio, miliseconds){
                audio[0].volume = 0; 
                audio.animate({volume: 0.2}, miliseconds); 
            }
            
            function fadeOutSound(audio, miliseconds){
                audio.animate({volume: 0}, miliseconds); 
            }

      });

	</script>
</head>

<body>
    <audio src="Audio/Liebeslied.mp3" id="BGM" loop></audio>

	<div id="stage">

		<div id = playerTextbox class="textbox">
			<p id ="playerText" class="text">With the competition date getting closer, pretty much all my free time went to practicing.</p>
            <p id ="playerName" class="name"></p>
		</div>

        <div id="stage2">
        </div>

	</div>

</body>
</html>
